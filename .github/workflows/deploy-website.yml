name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/website

      - name: Build
        run: npm run build
        working-directory: apps/website

      # Cloudflare Pages Functions must live in a top-level `functions/`
      # directory relative to the deploy directory. Copy them in.
      - name: Copy Pages Functions into dist
        run: cp -r apps/website/functions apps/website/dist/functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/dist --project-name=cardgit-website --commit-dirty=true
