    <!-- Dark mode FOUC prevention -->
    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

      <main style="font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6;">
        <h1>CardGit — Digital Business Cards & Event Networking Platform</h1>
        
        <section>
          <h2>What is CardGit?</h2>
          <p>CardGit is a UK-based digital identity and professional networking platform that offers two products:</p>
          <ul>
            <li><strong>CardGit</strong> — Digital business cards with QR code sharing and analytics</li>
            <li><strong>CardGit Events</strong> — Networking-first event management platform for conferences and business events</li>
          </ul>
        </section>
        
        <section>
          <h2>CardGit Digital Business Cards</h2>
          <p>Create a shareable digital profile accessible via QR code or link. Replace physical paper business cards with a dynamic, updatable digital identity that includes:</p>
          <ul>
            <li>QR code profile sharing — no app required to view</li>
            <li>Lead capture — collect visitor contact details directly from the card</li>
            <li>Appointment booking — clients book meetings from the card</li>
            <li>Social media integration (LinkedIn, WhatsApp, Instagram, TikTok, Facebook, X, YouTube)</li>
            <li>Real-time analytics — views, clicks, engagement, and audience location data</li>
            <li>Team/enterprise management dashboard</li>
            <li>Multiple cards per user</li>
          </ul>
          <p><strong>Who uses it:</strong> Professionals, freelancers, entrepreneurs, SMEs, sales teams, recruitment agencies, property consultants, and enterprise teams.</p>
          <p><strong>Pricing:</strong> Free tier available. <a href="https://cardgit.com/pricing">View pricing</a></p>
        </section>
        
        <section>
          <h2>CardGit Events</h2>
          <p>Event management platform designed for conference organisers, summit teams, and business networking events. Supports in-person, virtual, and hybrid events with:</p>
          <ul>
            <li>Smart matchmaking — AI-powered attendee matching</li>
            <li>Speed networking sessions</li>
            <li>Attendee registration with Stripe-powered ticketing</li>
            <li>Speaker and sponsor management</li>
            <li>Live Q&A, polls, and social wall</li>
            <li>Gamification with leaderboards and challenges</li>
            <li>Event analytics and revenue reporting</li>
            <li>Check-in portal with QR code scanning</li>
          </ul>
          <p><a href="https://events.cardgit.com">Visit CardGit Events</a></p>
        </section>
        
        <section>

            <li><a href="https://cardgit.com/features">View all features</a></li>
            <li><a href="https://cardgit.com/enterprise">Enterprise solutions</a></li>
            <li><a href="https://cardgit.com/faq">FAQ</a></li>
