<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1a0f"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#22c55e" opacity="0.15"/>
  </pattern>
  <rect width="800" height="420" fill="url(#dots)"/>
  <ellipse cx="620" cy="210" rx="240" ry="180" fill="#16a34a" opacity="0.1"/>
  <!-- Paper card (left, crossed out) -->
  <rect x="440" y="100" width="140" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="448" y1="128" x2="572" y2="128" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
  <line x1="448" y1="145" x2="540" y2="145" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  <line x1="448" y1="160" x2="520" y2="160" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  <circle cx="462" cy="115" r="10" fill="#334155"/>
  <!-- Cross on paper -->
  <line x1="440" y1="100" x2="580" y2="190" stroke="#ef4444" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="580" y1="100" x2="440" y2="190" stroke="#ef4444" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <!-- Digital card (right, glowing) -->
  <rect x="610" y="80" width="150" height="230" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
  <circle cx="685" cy="130" r="22" fill="#166534"/>
  <circle cx="685" cy="122" r="9" fill="#4ade80" opacity="0.9"/>
  <ellipse cx="685" cy="145" rx="14" ry="8" fill="#4ade80" opacity="0.7"/>
  <rect x="625" y="163" width="60" height="8" rx="4" fill="#1e3a2e"/>
  <rect x="625" y="178" width="45" height="7" rx="3" fill="#1e3a2e" opacity="0.8"/>
  <rect x="627" y="200" width="110" height="26" rx="8" fill="#16a34a"/>
  <text x="682" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="white">Book a Meeting</text>
  <!-- QR code mini -->
  <rect x="730" y="85" width="22" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="733" y="88" width="7" height="7" rx="1" fill="#4ade80"/>
  <rect x="742" y="88" width="7" height="7" rx="1" fill="#4ade80"/>
  <rect x="733" y="97" width="7" height="7" rx="1" fill="#4ade80"/>
  <rect x="742" y="97" width="7" height="7" rx="1" fill="#4ade80"/>
  <!-- Stats on digital card -->
  <rect x="625" y="236" width="46" height="32" rx="6" fill="#1e3a2e" stroke="#166534" stroke-width="1"/>
  <text x="648" y="252" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="900" fill="#4ade80">124</text>
  <text x="648" y="263" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#6b7280">Clicks</text>
  <rect x="678" y="236" width="46" height="32" rx="6" fill="#1e3a2e" stroke="#166534" stroke-width="1"/>
  <text x="701" y="252" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="900" fill="#34d399">32</text>
  <text x="701" y="263" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#6b7280">Leads</text>
  <!-- Arrow -->
  <text x="420" y="220" font-family="Inter,sans-serif" font-size="28" fill="#22c55e" opacity="0.7">→</text>
  <!-- Category -->
  <rect x="60" y="50" width="270" height="32" rx="16" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="1"/>
  <text x="195" y="71" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#4ade80">Digital Business Card Best Practices</text>
  <!-- Title -->
  <text x="60" y="145" font-family="Inter,sans-serif" font-size="34" font-weight="900" fill="white">Digital vs Paper</text>
  <text x="60" y="188" font-family="Inter,sans-serif" font-size="34" font-weight="900" fill="white">Business Cards</text>
  <text x="60" y="225" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#4ade80">A Practical Comparison</text>
  <text x="60" y="270" font-family="Inter,sans-serif" font-size="15" fill="#94a3b8">Cost · functionality · analytics</text>
  <text x="60" y="292" font-family="Inter,sans-serif" font-size="15" fill="#94a3b8">and environmental impact.</text>
  <rect x="60" y="360" width="100" height="28" rx="14" fill="#16a34a" opacity="0.2"/>
  <text x="110" y="379" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#4ade80">CardGit Blog</text>
  <text x="740" y="379" text-anchor="end" font-family="Inter,sans-serif" font-size="12" fill="#64748b">4 min read</text>
</svg>
