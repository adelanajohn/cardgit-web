<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#6366f1" opacity="0.2"/>
  </pattern>
  <rect width="800" height="420" fill="url(#dots)"/>
  <!-- Glow -->
  <ellipse cx="600" cy="200" rx="280" ry="200" fill="#6366f1" opacity="0.12"/>
  <!-- Network nodes -->
  <circle cx="560" cy="140" r="28" fill="#6366f1" opacity="0.9"/>
  <circle cx="660" cy="220" r="20" fill="#7c3aed" opacity="0.85"/>
  <circle cx="580" cy="300" r="16" fill="#818cf8" opacity="0.8"/>
  <circle cx="700" cy="140" r="12" fill="#a5b4fc" opacity="0.7"/>
  <circle cx="480" cy="240" r="14" fill="#4f46e5" opacity="0.8"/>
  <!-- Connections -->
  <line x1="560" y1="140" x2="660" y2="220" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <line x1="660" y1="220" x2="580" y2="300" stroke="#7c3aed" stroke-width="2" opacity="0.5"/>
  <line x1="560" y1="140" x2="700" y2="140" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="480" y1="240" x2="560" y2="140" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="480" y1="240" x2="660" y2="220" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <!-- People icons on nodes -->
  <circle cx="560" cy="133" r="8" fill="white" opacity="0.9"/>
  <path d="M548,154 Q560,146 572,154" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Category label -->
  <rect x="60" y="50" width="190" height="32" rx="16" fill="#6366f1" opacity="0.25" stroke="#6366f1" stroke-width="1"/>
  <text x="155" y="71" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">Networking Strategies</text>
  <!-- Title -->
  <text x="60" y="145" font-family="Inter,sans-serif" font-size="36" font-weight="900" fill="white">How to Network</text>
  <text x="60" y="192" font-family="Inter,sans-serif" font-size="36" font-weight="900" fill="white">Effectively at UK</text>
  <text x="60" y="239" font-family="Inter,sans-serif" font-size="36" font-weight="900" fill="#818cf8">Conferences 2026</text>
  <!-- Subtext -->
  <text x="60" y="285" font-family="Inter,sans-serif" font-size="16" fill="#94a3b8">A practical guide to pre-event prep,</text>
  <text x="60" y="308" font-family="Inter,sans-serif" font-size="16" fill="#94a3b8">targeted conversations &amp; follow-up.</text>
  <!-- Cardgit brand -->
  <rect x="60" y="360" width="100" height="28" rx="14" fill="#6366f1" opacity="0.2"/>
  <text x="110" y="379" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#818cf8">CardGit Blog</text>
  <!-- Read time -->
  <text x="740" y="379" text-anchor="end" font-family="Inter,sans-serif" font-size="12" fill="#64748b">5 min read</text>
</svg>
