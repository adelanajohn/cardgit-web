<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
