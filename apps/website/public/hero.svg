  <text x="248" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#9333ea">Instagram</text>
  <rect x="279" y="230" width="60" height="22" rx="11" fill="#fff7ed"/>
