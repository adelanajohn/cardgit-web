  <text x="572" y="225" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#0f172a">James D.</text>
  <text x="572" y="239" font-family="Inter,sans-serif" font-size="10" fill="#6b7280">Senior Engineer · FinTech</text>
  <rect x="720" y="218" width="68" height="22" rx="11" fill="#7c3aed"/>
  <text x="754" y="233" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="white">98% match</text>

  <rect x="520" y="264" width="280" height="56" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="546" cy="292" r="16" fill="#2563eb"/>
  <text x="546" y="297" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="white">SR</text>
  <text x="572" y="287" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#0f172a">Sarah R.</text>
  <text x="572" y="301" font-family="Inter,sans-serif" font-size="10" fill="#6b7280">Product Lead · SaaS</text>
  <rect x="720" y="280" width="68" height="22" rx="11" fill="#2563eb"/>
  <text x="754" y="295" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="white">94% match</text>

  <!-- Divider -->
  <line x1="520" y1="332" x2="820" y2="332" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Live stats row -->
  <text x="520" y="352" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8" font-weight="500">LIVE ENGAGEMENT</text>

  <rect x="520" y="360" width="82" height="46" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="561" y="382" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="900" fill="#16a34a">142</text>
  <text x="561" y="396" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">Q&amp;A votes</text>

  <rect x="610" y="360" width="82" height="46" rx="10" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="651" y="382" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="900" fill="#9333ea">89%</text>
  <text x="651" y="396" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">Engaged</text>

  <rect x="700" y="360" width="100" height="46" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="750" y="382" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="900" fill="#ea580c">🏆 32</text>
  <text x="750" y="396" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">Leaderboard</text>

