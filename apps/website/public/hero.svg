  <circle cx="538" cy="433" r="8" fill="url(#eventsGrad)"/>
  <text x="610" y="437" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">CardGit Events</text>
