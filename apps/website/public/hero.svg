  <rect x="237" y="107" width="38" height="38" rx="4" fill="white"/>
  <!-- QR pattern -->
  <rect x="239" y="109" width="7" height="7" rx="1" fill="#6366f1"/>
  <rect x="248" y="109" width="4" height="4" rx="1" fill="#6366f1"/>
  <rect x="248" y="115" width="4" height="4" rx="1" fill="#6366f1"/>
  <rect x="261" y="109" width="7" height="7" rx="1" fill="#6366f1"/>
  <rect x="239" y="122" width="4" height="7" rx="1" fill="#6366f1"/>
  <rect x="244" y="127" width="4" height="4" rx="1" fill="#6366f1"/>
  <rect x="250" y="122" width="7" height="4" rx="1" fill="#6366f1"/>
  <rect x="261" y="122" width="7" height="7" rx="1" fill="#6366f1"/>
  <rect x="239" y="136" width="7" height="7" rx="1" fill="#6366f1"/>
  <rect x="253" y="133" width="4" height="4" rx="1" fill="#6366f1"/>
