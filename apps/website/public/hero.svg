  <!-- Avatar circle -->
  <circle cx="160" cy="145" r="38" fill="url(#avatarGrad)"/>
  <!-- Person silhouette -->
  <circle cx="160" cy="132" r="14" fill="white" opacity="0.9"/>
  <ellipse cx="160" cy="162" rx="20" ry="12" fill="white" opacity="0.7"/>

  <!-- Name + role -->
  <rect x="210" y="125" width="120" height="12" rx="6" fill="#e0e7ff"/>
  <rect x="210" y="145" width="90" height="9" rx="4" fill="#ede9fe" opacity="0.8"/>
  <rect x="210" y="161" width="100" height="9" rx="4" fill="#f1f5f9" opacity="0.6"/>

  <!-- QR Code block -->
